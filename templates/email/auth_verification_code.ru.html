<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Код подтверждения</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f6fb;font-family:Arial,Helvetica,sans-serif;color:#161821;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f6fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e8eaf2;">
            <tr>
              <td style="padding:28px 28px 12px;font-size:22px;font-weight:700;">Код подтверждения</td>
            </tr>
            <tr>
              <td style="padding:0 28px 18px;font-size:15px;line-height:1.6;color:#555b6d;">Используйте этот код, чтобы подтвердить доступ к аккаунту.</td>
            </tr>
            <tr>
              <td style="padding:0 28px 22px;">
                <div style="display:inline-block;padding:14px 22px;border-radius:14px;background:#161821;color:#ffffff;font-size:28px;font-weight:700;letter-spacing:4px;">{{code}}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 30px;font-size:13px;line-height:1.5;color:#7b8192;">Код действует {{ttl_sec}} секунд. Если вы не запрашивали код, просто проигнорируйте письмо.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
