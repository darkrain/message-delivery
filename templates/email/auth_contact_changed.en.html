<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign-in contact changed</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f6fb;font-family:Arial,Helvetica,sans-serif;color:#161821;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f6fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e8eaf2;">
            <tr>
              <td style="padding:28px 28px 12px;font-size:22px;font-weight:700;">Sign-in contact changed</td>
            </tr>
            <tr>
              <td style="padding:0 28px 18px;font-size:15px;line-height:1.6;color:#555b6d;">This e-mail was replaced with {{new_contact}} on your account. Sign-in and password recovery now use the new address.</td>
            </tr>
            <tr>
              <td style="padding:0 28px 30px;font-size:13px;line-height:1.5;color:#7b8192;">If you did not do this, contact support right away: reply to this message or write to us through the website.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
